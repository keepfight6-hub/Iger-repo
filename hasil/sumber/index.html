- Gaya: Kartun Cutout Deadpan 2D, flat vector, outline cokelat tua #3A2516 ±11 px, cel 1 tingkat (bayangan kanan-bawah)
- Tokoh: gajah boneka bersendi (kaki, telinga, belalai, ekor), kepala besar, mata titik, mulut garis datar, pipi pink
- Motif: tikus kecil deadpan, muncul di tiap adegan
- Palet: langit #8FCFE6 → #CDEAF0 → #FCE3C4 · tanah #EBCB98 · gajah #A7B3C6/#8390A6 · tikus #C4BCC8 · pink #F4AFC0 · aksen #FFC94D
- Latar: savana minimalis, bukit setengah lingkaran, gunung segitiga bulat, akasia sederhana, awan lembut tanpa garis
- Kamera: dorong pelan terus + goyang halus, guncang kecil saat kaget
- Tanda tangan gerak: kaget = lompat kecil + telinga mengembang + belalai melengkung naik + tetes keringat + garis kaget
- Transisi: potong langsung (tanpa geser/slide)
- Tanpa teks, tanpa subtitle, tanpa efek suara (VO saja), 9:16 1080×1920
-->

<script>
/* ==== [0] penangkap error */
const ERR=document.getElementById('err');
function tampilErr(m){ERR.hidden=false;ERR.textContent='Error: '+m;}

/* ==== [1] inti */
const W=1080,H=1920,INK='#3A2516';
const cv=document.getElementById('c'),X=cv.getContext('2d');
const lerp=(a,b,k)=>a+(b-a)*k, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const nz=(t,b=0)=>{const i=Math.floor(t),f=t-i,u=f*f*(3-2*f);return lerp(hash(i+b*57)*2-1,hash(i+1+b*57)*2-1,u);};
const bz=(a,b,c,d,u)=>{const v=1-u;return[v*v*v*a[0]+3*v*v*u*b[0]+3*v*u*u*c[0]+u*u*u*d[0],v*v*v*a[1]+3*v*v*u*b[1]+3*v*u*u*c[1]+u*u*u*d[1]];};

/* ==== [2] waktu (dari jeda VO) */
const WAKTU={A:0,B:2.88,C:5.47,D:8.47,E:11.1,F:13.95,G:16.6,HH:19.45,I:21.0,J:23.75,K:27.0,L:30.4,M:32.45,N:34.1,O:37.3,Q:39.1,R:41.75,S:44.05,U:47.95,V:49.15,Y:53.1,dur:57.2,tikusMuncul:1.72,kagetA:2.06,lirik:4.25,kagetC:7.12};

/* ==== [3] kuas cutout */
let LW=11;
const P=fn=>{const p=new Path2D();fn(p);return p;};
const ELL=(cx,cy,rx,ry,r=0)=>P(p=>p.ellipse(cx,cy,rx,ry,r,0,Math.PI*2));
function isi(p,f,sh,dx=16,dy=13,lw=LW){

function tabung(a,b,c,d,w,f,sh){

}

  const p=P(p=>{for(let i=0;i<8;i++){const rr=i%2?r*.36:r,an=i*Math.PI/4-Math.PI/2;i?p.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):p.moveTo(Math.cos(an)*rr,Math.sin(an)*rr);}p.closePath();});

  isi(P(p=>{p.moveTo(0,-34);p.bezierCurveTo(14,-12,24,2,24,14);p.arc(0,14,24,0,Math.PI);p.bezierCurveTo(-24,2,-14,-12,0,-34);p.closePath();}),'#BFE9FA','#8FD3F0',6,5,LW/s);

  for(let i=0;i<n;i++){const an=mulai+lebar*i/(n-1);const ra=lerp(r0,r1*.95,E.out(k));
    X.globalAlpha=a;garis(cx+Math.cos(an)*ra,cy+Math.sin(an)*ra,cx+Math.cos(an)*(ra+r1*.28),cy+Math.sin(an)*(ra+r1*.28),LW*1.1);}
  X.globalAlpha=1;

/* ==== [4] tokoh: GAJAH (boneka bersendi, menghadap kanan; kaki di y=0) */
const GJ={f:'#A7B3C6',sh:'#8390A6',bf:'#929EB4',bsh:'#727E95',pink:'#F4AFC0',kuku:'#F6EEDF'};
function kaki(hx,hy,ang,f,sh){
  X.save();X.translate(hx,hy);X.rotate(ang);
  isi(P(p=>p.roundRect(-48,-30,96,200,[34,34,28,28])),f,sh,14,0);
  for(const dx of[-25,0,25])isi(ELL(dx,163,12,9),GJ.kuku,null,0,0,LW*.6);
  X.restore();
}
function gajahUjung(o){ /* titik ujung belalai (lokal) */
  const c=o.belalai||0,w=Math.sin((o.t||0)*1.7)*8;
  return [lerp(398,468,c)+w,lerp(-112,-604,c)+(o.turun||0)];
}
function gajah(o){
  const s=o.s,t=o.t,q=o.squash||0;
  X.save();X.translate(o.x+(o.trem||0),o.y-(o.hop||0));X.scale(s*(1+q)*(o.arah||1),s*(1-q));LW=11/(s*(o.z||1));
  const L=o.kaki||[0,0,0,0],napas=Math.sin(t*2.4)*.012;
  /* kaki belakang */
  if(!o.tanpaKaki){kaki(-185,-170,L[0],GJ.bf,GJ.bsh);kaki(105,-170,L[2],GJ.bf,GJ.bsh);}
  /* ekor */

  isi(P(p=>{p.moveTo(-60,128);p.quadraticCurveTo(-46,190,-30,128);p.closePath();}),'#6F5B4B',null);
  X.restore();
  /* badan */
  X.save();X.translate(-10,-285);X.scale(1+napas,1-napas);
  isi(ELL(0,0,272,186),GJ.f,GJ.sh,28,24);
  X.globalAlpha=.55;for(const [x,y] of[[-120,40],[-150,70]]){X.beginPath();X.arc(x,y,40,1.9,2.9);X.lineWidth=LW*.6;X.strokeStyle=INK;X.stroke();}X.globalAlpha=1;
  X.restore();
  /* kaki depan */
  if(!o.tanpaKaki){kaki(-110,-160,L[1],GJ.f,GJ.sh);kaki(185,-160,L[3],GJ.f,GJ.sh);}
  /* belalai (sebelum kepala supaya pangkalnya tertutup) */
  const c=o.belalai||0,w=Math.sin(t*1.7)*8,ujung=gajahUjung(o);
  const a=[352,-392],b=[lerp(428,452,c),lerp(-330,-410,c)],cc=[lerp(440,512,c)+w*.5,lerp(-205,-500,c)+(o.turun||0)*.6];
  tabung(a,b,cc,ujung,74,GJ.f,GJ.sh);
  for(const u of[.45,.62,.78]){const m=bz(a,b,cc,ujung,u),m2=bz(a,b,cc,ujung,u+.02),dx=m2[0]-m[0],dy=m2[1]-m[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
    X.globalAlpha=.6;garis(m[0]+nx*24,m[1]+ny*24,m[0]-nx*8,m[1]-ny*8,LW*.6);X.globalAlpha=1;}
  if(o.benjol!=null){const m=bz(a,b,cc,ujung,o.benjol);isi(ELL(m[0],m[1],64,58),GJ.f,GJ.sh,10,9);}
  if(o.ekorTikus){const e=ujung;tabung([e[0],e[1]+10],[e[0]+16,e[1]+70],[e[0]+46+Math.sin(t*9)*22,e[1]+96],[e[0]+70+Math.sin(t*11)*28,e[1]+70],11,'#F2B8C6','#D896A8');}
  isi(ELL(ujung[0],ujung[1],40,30,c*-1.2),GJ.f,GJ.sh,6,6);
  X.fillStyle=INK;X.beginPath();X.ellipse(ujung[0]+lerp(-10,12,c),ujung[1]+lerp(10,-4,c),6,9,c*-1.2,0,7);X.fill();
  X.beginPath();X.ellipse(ujung[0]+lerp(12,22,c),ujung[1]+lerp(10,10,c),6,9,c*-1.2,0,7);X.fill();
  /* kepala */
  isi(ELL(235,-440,168,162),GJ.f,GJ.sh,22,18);
  /* telinga (sendi di atas-kiri kepala) */
  X.save();X.translate(175,-505);X.rotate(-(o.telinga||0)+Math.sin(t*3.1)*.05);
  isi(P(p=>p.ellipse(-62,82,118,152,.22,0,Math.PI*2)),GJ.f,GJ.sh,16,14);
  isi(ELL(-54,82,76,106,.22),GJ.pink,'#E08EA4',10,8,LW*.7);

  const lx=o.lx??.35,ly=o.ly??.1;
  if(o.tidur){for(const [ex,ey] of[[284,-484],[340,-474]]){X.beginPath();X.arc(ex,ey-6,17,.35,Math.PI-.35);X.lineWidth=LW;X.strokeStyle=INK;X.stroke();}}
  else for(const [ex,ey] of[[284,-488],[340,-478]]){
    X.save();X.translate(ex,ey);X.scale(1,kedip);
    isi(ELL(0,0,er,er),'#FFFFFF',null,0,0,LW*.8);

    X.restore();

  }

/* ==== [5] tokoh: TIKUS (menghadap kanan; arah:-1 menghadap kiri; kaki di y=0) */
function tikus(o){
  const s=o.s,t=o.t;
  X.save();X.translate(o.x,o.y);X.scale(s*(o.arah||1),s);LW=9/(s*(o.z||1));

    isi(ELL(0,0,10,10),'#fff',null,0,0,LW*.7);X.fillStyle=INK;X.beginPath();X.arc(lx*4,ly*4,3.8,0,7);X.fill();X.restore();}
  isi(ELL(108,-108,10,9),'#F08AA2',null,0,0,LW*.7);

  X.globalAlpha=.8;garis(112,-104,156,-114,LW*.45);garis(112,-100,158,-96,LW*.45);X.globalAlpha=1;
  X.fillStyle='rgba(244,140,160,.5)';X.beginPath();X.ellipse(70,-104,10,6,0,0,7);X.fill();
  if(o.keju){X.save();X.translate(64,-64);X.rotate(-.15);
    isi(P(p=>{p.moveTo(-34,22);p.lineTo(40,22);p.lineTo(40,-26);p.closePath();}),'#FFD45C','#F0B53A',5,5);

/* ==== [6] latar */
const AWAN=(()=>{const c=document.createElement('canvas');c.width=640;c.height=300;const g=c.getContext('2d');
  for(const [x,y,r] of[[170,190,95],[290,140,120],[420,180,100],[520,205,72],[95,215,60],[330,215,95]]){
    const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba(255,255,255,.95)');rg.addColorStop(.62,'rgba(255,255,255,.8)');rg.addColorStop(1,'rgba(255,255,255,0)');
