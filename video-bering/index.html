<title>Pulau Kemarin & Besok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pathway+Extreme:opsz,wdth,wght@8..12,75..100,600..900&family=Radio+Canada:ital,wght@0,600;0,700;1,600&display=swap">
<!--
gaya.md — Pulau Kemarin & Pulau Besok (peta-relief, varian "Arktik akhir musim panas")
- Gaya: Peta Relief Sinematik. Data pantai: Natural Earth 10m (domain publik), tepi dihaluskan + noise kecil
- Kamera: three.js FOV 30, turun dari atas awan -> miring 40-58 derajat, terus mengorbit pelan
- Cahaya: matahari rendah dari barat daya, bayangan tebing jatuh ke laut, kabut dingin di kejauhan
- Palet: tundra #5C6A3E / #7A7650, batu #7D7464, salju #E6ECEF, laut #3A9FAE -> #1F7590 -> #0E3B5E,
  kabut #8FA9B8, teks krem #FFF6E6, SENIN biru es #8FE0FF, SELASA emas #FFC76E, garis tanggal putih-emas
- Font: Pathway Extreme (angka, nama hari) + Radio Canada (nama pulau, keterangan)
- Subtitle: MATI (permintaan user). Teks layar hanya angka, nama hari, nama pulau, negara
- Tanda tangan gerak: garis batas tanggal naik sebagai tirai cahaya dari permukaan laut
- Suara: VO user (vo.mp3) saja, tanpa efek suara (permintaan user)
- Skala: satu kamera terbang mulus dari 4 km (kedua pulau) sampai ±400 km (seluruh Selat Bering)
-->
<style>
:root{
  --bg:#050d15; --panel:#0c1824; --line:#1d3244; --fg:#e9eef2; --dim:#8fa3b3; --acc:#ffc76e; --err:#c0392b;
  --ui:"Radio Canada", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:10px;overflow:hidden}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
#stage{height:100%;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:10px;display:block;object-fit:contain}
#ui{width:100%;max-width:560px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#ui button{font:600 14px var(--ui);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
#ui button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#ui button.on{border-color:var(--acc);color:var(--acc)}
#seek{flex:1 1 160px;min-width:0;accent-color:var(--acc)}
#tm{font:600 13px var(--ui);color:var(--dim);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
#status{width:100%;max-width:560px;font-size:13px;color:var(--dim);min-height:1.2em}
#err{position:fixed;left:16px;right:16px;top:16px;background:var(--err);color:#fff;font:600 13px/1.4 monospace;padding:10px 12px;border-radius:8px;white-space:pre-wrap;z-index:50}
#sheet{position:fixed;inset:0;background:rgba(3,8,12,.94);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#sheet .row{display:flex;gap:8px;max-width:100%;overflow-x:auto}
#sheet figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
#sheet img{height:min(62vh,520px);aspect-ratio:9/16;border-radius:6px;border:1px solid var(--line)}
#sheet .tutup{font:600 14px var(--ui);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 16px}
#sheet figcaption{font:600 12px var(--ui);color:var(--dim)}
body.full #ui,body.full #status{display:none}
body.full{padding:0}
body.full #stage{border-radius:0}
</style>

<div id="wrap"><canvas id="stage" width="1080" height="1920"></canvas></div>
<div id="ui">
  <button id="play" type="button">Putar</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Waktu">
  <span id="tm">0,0 / 0,0</span>
  <button id="sheetBtn" type="button">Lembar</button>
  <button id="fullBtn" type="button">Layar penuh</button>
</div>
<div id="status">Menyiapkan peta relief…</div>
<div id="err" hidden></div>
<div id="sheet" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="coast.js"></script>
<script>
/* ==== penangkap error (skrip terpisah supaya tetap jalan bila skrip utama gagal dibaca) */
const ERR=document.getElementById('err');
function showErr(m){ERR.hidden=false;ERR.textContent+=(ERR.textContent?'\n':'')+m;}
window.addEventListener('error',e=>showErr('Error: '+e.message+(e.lineno?' (baris '+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>showErr('Error: '+(e.reason&&e.reason.message||e.reason)));
</script>
<script src="main.js"></script>
